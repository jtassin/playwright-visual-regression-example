name: Update snapshots

# Changement visuel volontaire : on régénère les baselines depuis la CI
# (jamais depuis un poste dev) et on les commit sur la branche de la PR.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --update-snapshots
        env:
          HOME: /root
      - name: Commit des nouvelles baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          git diff --cached --quiet && echo "Aucun changement" && exit 0
          git commit -m "chore: update visual snapshots"
          git push
